[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "opencv-facial-blur"
version = "0.2.0"
description = "Real-time facial blur using MediaPipe and OpenCV"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "mediapipe>=0.10",
    "numpy>=1.26",
]

[project.scripts]
facial-blur = "blur:main"
